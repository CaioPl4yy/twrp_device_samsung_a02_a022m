name: Build TWRP A022M

on:
  workflow_dispatch:
    inputs:
      manifest_branch:
        description: "Branch do minimal manifest do TWRP"
        default: "twrp-11"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout da device tree
        uses: actions/checkout@v4
        with:
          path: devicetree

      - name: Conferir prebuilts
        run: |
          for f in kernel dtb.img dtbo.img; do
            if [ ! -s "devicetree/prebuilt/$f" ]; then
              echo "Faltando devicetree/prebuilt/$f (ver prebuilt/README.txt)"
              exit 1
            fi
          done

      - name: Liberar disco
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Swap extra
        run: |
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          df -h /
          free -h

      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses-dev \
            x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils \
            xsltproc unzip fontconfig python3 python-is-python3 libncurses5 \
            rsync bc ccache

      - name: Sync do minimal manifest
        run: |
          mkdir -p ~/bin ~/twrp
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          git config --global user.name "builder"
          git config --global user.email "builder@example.com"
          cd ~/twrp
          ~/bin/repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b "${{ inputs.manifest_branch }}"
          ~/bin/repo sync -c -j4 --force-sync --no-clone-bundle --no-tags

      - name: Colocar a device tree
        run: |
          mkdir -p ~/twrp/device/samsung
          rm -rf ~/twrp/device/samsung/a02
          cp -r "$GITHUB_WORKSPACE/devicetree" ~/twrp/device/samsung/a02
          rm -rf ~/twrp/device/samsung/a02/.git ~/twrp/device/samsung/a02/.github

      - name: Compilar recovery
        run: |
          cd ~/twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          source build/envsetup.sh
          lunch twrp_a02-eng
          mka -j"$(nproc)" recoveryimage

      - name: Conferir imagem
        run: |
          cd ~/twrp
          IMG=out/target/product/a02/recovery.img
          SIZE=$(stat -c%s "$IMG")
          echo "recovery.img: $SIZE bytes (limite 25165824)"
          python3 system/tools/mkbootimg/unpack_bootimg.py --boot_img "$IMG" || true
          mkdir -p "$GITHUB_WORKSPACE/artifact"
          cp "$IMG" "$GITHUB_WORKSPACE/artifact/recovery.img"
          cd "$GITHUB_WORKSPACE/artifact"
          tar -H ustar -c recovery.img > recovery.tar
          ls -l
          test "$SIZE" -le 25165824

      - name: Publicar resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twrp-a022m
          path: ${{ github.workspace }}/artifact/
          if-no-files-found: ignore
